name = "receipts-api"
main = "worker/api.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WAYBACK_USER_AGENT = "Receipts/1.0 (+http://localhost:3000; contact: adityachitragar2.0@gmail.com)"

[[d1_databases]]
binding = "RECEIPTS_DB"
database_name = "receipts-db"
database_id = "298d4c31-c77c-4182-8fb8-cceff62f5682"
migrations_dir = "migrations"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[dev]
port = 8787
